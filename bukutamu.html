                        <h1><font color="#0077b6">Buku Tamu</font></h1>
                        <p>Yuk isi Pesan Atau Kesan Setelah Mengunjungi Situs Ini</p>
                        <form action="#" method="post">
                            <table width="100%" border="0" cellpadding="8" bgcolor="#e0f7fa">
                                <tr>
                                    <td width="160"><label for="nama"><b>Nama</b></label></td>
                                    <td><input type="text" maxlength="45" id="nama" name="nama" size="40" placeholder="Nama lengkap"></td>
                                </tr>
                                <tr>
                                    <td><label for="email"><b>Email</b></label></td>
                                    <td><input type="email" maxlength="25" id="email" name="email" size="40" placeholder="nama@email.com"></td>
                                </tr>
                                <tr>
                                    <td><b>Jenis Kelamin</b></td>
                                    <td>
                                        <input type="radio" id="pria" name="gender" value="Laki-laki"> <label for="pria">Laki-laki</label>
                                        <input type="radio" id="wanita" name="gender" value="Perempuan"> <label for="wanita">Perempuan</label>
                                    </td>
                                </tr>
                                <tr valign="top">
                                    <td><label for="pesan"><b>Pesan / Kesan</b></label></td>
                                    <td><textarea maxlength="100" id="pesan" name="pesan" rows="6" cols="50" placeholder="Tulis pesan dan kesanmu di sini..."></textarea></td>
                                </tr>
                                <tr>
                                    <td>&nbsp;</td>
                                    <td>
                                        <input type="submit" value="Kirim">
                                        <input type="reset" value="Reset">
                                    </td>
                                </tr>
